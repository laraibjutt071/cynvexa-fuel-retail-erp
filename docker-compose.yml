services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cynvexa
      POSTGRES_PASSWORD: cynvexa
      POSTGRES_DB: cynvexa
    ports:
      - "5432:5432"
    volumes:
      - cynvexa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cynvexa -d cynvexa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Pure cache, not a source of truth (see backend/app/core/cache.py) - no
    # volume, no persistence. Losing it on restart just means a few cold
    # cache misses, never lost or stale real data.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://cynvexa:cynvexa@db:5432/cynvexa
      # A separate database on the same Postgres server, never the one
      # above - Postgres isolates databases from each other at the engine
      # level, so a DROP SCHEMA against this one cannot reach "cynvexa".
      # Read only by backend/tests/conftest.py; the running application
      # never touches this variable. See
      # docs/TEST_DATABASE_ISOLATION_REPORT.md.
      TEST_DATABASE_URL: postgresql+asyncpg://cynvexa:cynvexa@db:5432/cynvexa_test
      # Deliberately NOT gated on redis being healthy below (see
      # depends_on) - app/core/cache.py treats an unreachable Redis as
      # "caching off", so the backend must be able to start and serve
      # requests whether or not redis is up.
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # Dev-only durability for the local evidence-upload backend (see
      # app/core/storage.py) so files survive a container restart. Still
      # not safe with more than one backend instance - swap for object
      # storage before any real deployment.
      - cynvexa_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time - see Dockerfile comment.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  cynvexa_db_data:
  cynvexa_uploads:
